[project]
name = "options-risk-lab"
version = "0.1.0"
description = "Auditable synthetic options risk and self-financing hedge research"
requires-python = ">=3.14,<3.15"
dependencies = ["numpy", "scipy", "QuantLib", "pydantic", "pyarrow", "duckdb", "fastapi", "uvicorn", "typer", "torch", "matplotlib"]
[dependency-groups]
dev = ["pytest", "hypothesis", "httpx", "ruff", "mypy", "scipy-stubs"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project.scripts]
orl = "options_risk_lab.cli:app"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
